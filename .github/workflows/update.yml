name: Update Corneta

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Commit the verified update (false only validates)
        type: boolean
        default: false
  pull_request:
    paths: [".github/workflows/update.yml"]

permissions:
  contents: read

concurrency:
  group: corneta-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: bucket
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pitroldev/corneta
          ref: b5db392100f5894217e100d764be11ce91516d62
          path: automation
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.1
      - name: Download and verify the official signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node automation/scripts/distribution.mjs prepare .artifacts/release
      - name: Update manifest without downgrades or same-version replacements
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: node automation/scripts/distribution.mjs scoop .artifacts/release bucket
      - name: Commit the verified manifest
        if: >-
          steps.update.outputs.changed == 'true' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          node automation/scripts/distribution.mjs assert-current .artifacts/release
          node automation/scripts/commit-distribution.mjs scoop bucket "$VERSION"
      - name: Report result
        env:
          CHANGED: ${{ steps.update.outputs.changed }}
          PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish) }}
        run: echo "Manifest changed=$CHANGED; publication enabled=$PUBLISH." >> "$GITHUB_STEP_SUMMARY"
